{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="yandex-verification" content="483804ee2624c799" />
    <meta name="google-site-verification" content="4c3rOBL03AOQyTLYIp1Tao8NoDsfvQgq9zRg3exnNos" />
    {% block description %}{% endblock %}
    <link rel="icon" href="{% static 'mainpage/img/favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="{% static 'mainpage/css/bootstrap.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'mainpage/css/eCommerceStyle.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'mainpage/css/style.css' %}">
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
<div id="mainWrapper">
  <header>
    <!-- This is the header content. It contains Logo and links -->
    <div id="logo">
      <a href="{% url 'index'%}">
        <img src="{% static 'mainpage/img/favicon.ico' %}" alt="sample logo">
      </a>
    </div>
    <div id="headerLinks">
      <a href="{% url 'experiment' %}" title="Cart">Редактирование</a>
    </div>
  </header>
  <section id="offer" class="text-center">
    <!-- The offer section displays a banner text for promotions -->
    <h1>Изучение священного Корана по Аятам</h1>
  </section>
  <div id="content">
    <section class="mainContent">
        {% block content %}{% endblock %}
    </section>
  </div>
  <footer>
    <div>
      <p>Озвучка чтеца Корана - Мишари Рашид Аль-Афаси</p>
    </div>
    <div>
      <p>Перевод Корана - Эмира Кулиева</p>
    </div>
  </footer>
</div>
</div>
</body>
</html>
